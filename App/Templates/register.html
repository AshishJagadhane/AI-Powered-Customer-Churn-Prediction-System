```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | ChurnPredict AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f6fc; margin: 0; color: #172554; }
        nav { background: #14213d; padding: 20px 8%; color: white; }
        nav a { color: white; text-decoration: none; }
        .card { max-width: 420px; margin: 55px auto; padding: 30px; background: white; border-radius: 14px; box-shadow: 0 5px 22px #0001; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 17px; border: 1px solid #ccd3df; border-radius: 7px; }
        button { width: 100%; padding: 13px; background: #2563eb; color: white; border: 0; border-radius: 7px; cursor: pointer; }
        .message { background: #eff6ff; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
<nav><a href="{{ url_for('home') }}">← ChurnPredict AI</a></nav>
<div class="card">
    <h2>Create Customer Account</h2>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
        <label>Username</label>
        <input name="username" required autocomplete="username">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email">
        <label>Customer ID</label>
        <input name="customer_id" required placeholder="Your existing customer ID">
        <label>Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
        <button type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
</body>
</html>
